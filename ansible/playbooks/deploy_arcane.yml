---
- name: Bootstrap Arcane on Raspberry Pi
  hosts: raspi
  become: true
  vars_files:
    - ../vars/arcane.yml

  vars:
    arcane_deploy_dir: /opt/arcane

  tasks:
    - name: Create Arcane deployment directory
      ansible.builtin.file:
        path: "{{ arcane_deploy_dir }}"
        state: directory
        mode: "0750"

    - name: Copy Arcane compose file
      ansible.builtin.copy:
        src: ../../services/arcane/compose.yml
        dest: "{{ arcane_deploy_dir }}/compose.yml"
        mode: "0640"

    - name: Write Arcane .env file
      ansible.builtin.copy:
        dest: "{{ arcane_deploy_dir }}/.env"
        mode: "0600"
        content: |
          ARCANE_ENCRYPTION_KEY={{ arcane_encryption_key }}
          ARCANE_JWT_SECRET={{ arcane_jwt_secret }}

    - name: Deploy Arcane with podman-compose
      ansible.builtin.command:
        cmd: podman-compose up -d --remove-orphans
        chdir: "{{ arcane_deploy_dir }}"
      changed_when: true
