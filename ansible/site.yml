---
- name: Configure Valhalla Raspberry Pi server
  import_playbook: playbooks/optimize_raspberry.yml

- name: Install container runtime
  import_playbook: playbooks/install_podman.yml

# Arcane is the only service bootstrapped by Ansible.
# All stacks under stacks/ are managed by Arcane via git sync.
- name: Bootstrap Arcane
  import_playbook: playbooks/deploy_arcane.yml
