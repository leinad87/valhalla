services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    # Port not exposed — only reachable via Envoy at arcane.valhalla.local
    volumes:
      # Podman rootful socket (Docker-compatible API)
      - /run/podman/podman.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - GIN_MODE=release
      - PORT=3552
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - JWT_SECRET=${ARCANE_JWT_SECRET}
      - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate
    labels:
      - "com.getarcaneapp.arcane=true"
      - "caddy=arcane.valhalla.local"
      - "caddy.reverse_proxy={{upstreams 3552}}"
    networks:
      - valhalla-proxy

networks:
  valhalla-proxy:
    external: true
    name: valhalla-proxy

volumes:
  arcane-data:
