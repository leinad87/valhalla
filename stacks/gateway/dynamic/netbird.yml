# NetBird routing — replaces caddyfile-netbird.txt
# Loaded via the file provider (./dynamic/ directory)

http:
  routers:
    # gRPC — must match before the backend catch-all (higher priority)
    netbird-grpc:
      rule: "Host(`netbird.valhalla.myaddr.io`) && HeaderRegexp(`Content-Type`, `^application/grpc`)"
      service: netbird-server-h2c
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 30

    # Combined server paths: relay, signal, management, OAuth2
    netbird-backend:
      rule: "Host(`netbird.valhalla.myaddr.io`) && PathPrefix(`/relay`, `/ws-proxy`, `/api`, `/oauth2`)"
      service: netbird-server
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 20

    # Dashboard — catch-all for everything else
    netbird-dashboard:
      rule: "Host(`netbird.valhalla.myaddr.io`)"
      service: netbird-dashboard-svc
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      priority: 10

  services:
    # h2c transport for native gRPC
    netbird-server-h2c:
      loadBalancer:
        servers:
          - url: "h2c://netbird-server:80"

    netbird-server:
      loadBalancer:
        servers:
          - url: "http://netbird-server:80"

    netbird-dashboard-svc:
      loadBalancer:
        servers:
          - url: "http://netbird-dashboard:80"
