services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:ro
      - caddy-data:/data
    environment:
      - CADDY_INGRESS_NETWORKS=valhalla-proxy
    networks:
      - valhalla-proxy

networks:
  valhalla-proxy:
    name: valhalla-proxy
    driver: bridge

volumes:
  caddy-data:
