services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - /opt/stacks/qbittorrent/downloads:/downloads
    ports:
      # Web UI port intentionally not exposed — access via qui only
      - "6881:6881"      # BitTorrent TCP
      - "6881:6881/udp"  # BitTorrent UDP
    networks:
      - internal

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    # Port not exposed — only reachable via Envoy at qui.valhalla.local
    volumes:
      - qui-data:/config
      # Must match qBittorrent's download path exactly
      - /opt/stacks/qbittorrent/downloads:/downloads
    environment:
      - QUI__LOG_LEVEL=INFO
    networks:
      - internal
      - valhalla-proxy
    depends_on:
      - qbittorrent

networks:
  internal:
    driver: bridge
  valhalla-proxy:
    external: true
    name: valhalla-proxy

volumes:
  qbittorrent-config:
  qui-data:
