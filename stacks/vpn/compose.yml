services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false

  netbird-signal:
    image: netbirdio/signal:latest
    container_name: netbird-signal
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - netbird-signal:/var/lib/netbird
    networks:
      - valhalla-proxy

  netbird-relay:
    image: netbirdio/relay:latest
    container_name: netbird-relay
    restart: unless-stopped
    environment:
      - NB_LOG_LEVEL=info
      - NB_LISTEN_ADDRESS=:33080
      - NB_EXPOSED_ADDRESS=rels://${DUCKDNS_SUBDOMAINS}.duckdns.org:33080
      - NB_AUTH_SECRET=${NETBIRD_RELAY_SECRET}
    ports:
      - "33080:33080"
    networks:
      - valhalla-proxy

  netbird-management:
    image: netbirdio/management:latest
    container_name: netbird-management
    restart: unless-stopped
    depends_on:
      - netbird-signal
      - netbird-relay
    volumes:
      - netbird-mgmt:/var/lib/netbird
      - ./management.json:/etc/netbird/management.json
    ports:
      - "33073:33073"
    networks:
      - valhalla-proxy

  netbird-dashboard:
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    restart: unless-stopped
    environment:
      - NETBIRD_MGMT_API_ENDPOINT=https://${DUCKDNS_SUBDOMAINS}.duckdns.org:443
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://${DUCKDNS_SUBDOMAINS}.duckdns.org:33073
      - AUTH_AUDIENCE=${NETBIRD_AUTH_AUDIENCE}
      - AUTH_CLIENT_ID=${NETBIRD_AUTH_CLIENT_ID}
      - AUTH_AUTHORITY=${NETBIRD_AUTH_AUTHORITY}
      - USE_AUTH0=false
      - AUTH_SUPPORTED_SCOPES=openid profile email offline_access api
      - AUTH_REDIRECT_URI=https://${DUCKDNS_SUBDOMAINS}.duckdns.org/nb-auth
      - AUTH_SILENT_REDIRECT_URI=https://${DUCKDNS_SUBDOMAINS}.duckdns.org/nb-silent-auth
    labels:
      caddy: ${DUCKDNS_SUBDOMAINS}.duckdns.org
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - valhalla-proxy

networks:
  valhalla-proxy:
    external: true

volumes:
  netbird-signal:
  netbird-mgmt:
