services:
  myaddr-updater:
    image: alpine:latest
    restart: unless-stopped
    environment:
      - MYADDR_KEY=${MYADDR_KEY}
    command: >
      sh -c "while true; do
        wget -qO- 'https://ipv4.myaddr.tools/update?key=$$MYADDR_KEY&ip=self';
        sleep 300;
      done"
  netbird-signal:
    image: netbirdio/signal:latest
    container_name: netbird-signal
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - netbird-signal:/var/lib/netbird
    networks:
      - valhalla-proxy

  netbird-relay:
    image: netbirdio/relay:latest
    container_name: netbird-relay
    restart: unless-stopped
    environment:
      - NB_LOG_LEVEL=info
      - NB_LISTEN_ADDRESS=:33080
      - NB_EXPOSED_ADDRESS=rels://netbird.valhalla.myaddr.io:33080
      - NB_AUTH_SECRET=${NETBIRD_RELAY_SECRET}
    ports:
      - "33080:33080"
    networks:
      - valhalla-proxy

  netbird-management:
    image: netbirdio/management:latest
    container_name: netbird-management
    restart: unless-stopped
    depends_on:
      - netbird-signal
      - netbird-relay
    volumes:
      - netbird-mgmt:/var/lib/netbird
      - ./management.json:/etc/netbird/management.json
    ports:
      - "33073:33073"
    labels:
      caddy: netbird.valhalla.myaddr.io
      caddy.0_handle_path: /api*
      caddy.0_handle_path.reverse_proxy: "{{upstreams 80}}"
      caddy.1_handle_path: /.well-known*
      caddy.1_handle_path.reverse_proxy: "{{upstreams 80}}"
    networks:
      - valhalla-proxy

  netbird-dashboard:
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    restart: unless-stopped
    environment:
      - NETBIRD_MGMT_API_ENDPOINT=https://netbird.valhalla.myaddr.io:443
      - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://netbird.valhalla.myaddr.io:33073
      - AUTH_AUDIENCE=${NETBIRD_AUTH_CLIENT_ID}
      - AUTH_CLIENT_ID=${NETBIRD_AUTH_CLIENT_ID}
      - AUTH_AUTHORITY=https://netbird.valhalla.myaddr.io
      - USE_AUTH0=false
      - AUTH_SUPPORTED_SCOPES=openid profile email offline_access api
      - AUTH_REDIRECT_URI=https://netbird.valhalla.myaddr.io/nb-auth
      - AUTH_SILENT_REDIRECT_URI=https://netbird.valhalla.myaddr.io/nb-silent-auth
    labels:
      caddy: netbird.valhalla.myaddr.io
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - valhalla-proxy

networks:
  valhalla-proxy:
    external: true

volumes:
  netbird-signal:
  netbird-mgmt:
